name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # CPU wheels keep CI fast; GPU/QLoRA runs happen on a GPU box or Colab.
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[dev]"
      - run: ruff check src tests && ruff format --check src tests
      - name: Unit + end-to-end smoke tests (tiny random model, CPU)
        run: pytest -q
